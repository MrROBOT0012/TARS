<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARS — Sistema de Gestión Arrocera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1A6B42;--green-mid:#2A8A55;--green-light:#52B788;--green-pale:#D4EDE0;--green2:#52B788;
  --amber:#C47B1A;--amber-pale:#FEF0D7;
  --red:#C0392B;--red-pale:#FDECEA;
  --blue:#1B4F8A;--blue-pale:#DBEAFE;
  --purple:#5B21B6;--purple-pale:#EDE9FE;
  --teal:#0D6E56;--teal-pale:#D9F2EC;
  --gray:#1A2332;--gray2:#5A6A7A;--gray-pale:#F4F6F8;--gray-mid:#E0E5EC;
  --font:'Sora',system-ui,sans-serif;--mono:'JetBrains Mono','Geist Mono',monospace;
  --sidebar-w:224px;--topbar-h:52px;--bnav-h:64px;
  --radius-sm:6px;--radius:10px;--radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 2px 8px rgba(0,0,0,.09),0 1px 3px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.16);
}
body{font-family:var(--font);font-size:14px;color:var(--gray);background:var(--gray-pale);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── LAYOUT ── */
#app{display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);background:var(--green);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;box-shadow:2px 0 12px rgba(0,0,0,.15)}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:18px 14px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo-mark{width:34px;height:34px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.logo-name{font-size:15px;font-weight:800;color:#fff;letter-spacing:.2px}
.logo-sub{font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:.3px;margin-top:1px}
.nav{flex:1;padding:8px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.nav button{width:100%;background:none;border:none;padding:9px 10px;font-size:12.5px;font-family:var(--font);font-weight:500;cursor:pointer;color:rgba(255,255,255,.72);border-radius:var(--radius-sm);display:flex;align-items:center;gap:9px;text-align:left;transition:background .14s,color .14s;letter-spacing:-.01em;white-space:nowrap}
.nav button:hover:not(.active){background:rgba(255,255,255,.1);color:#fff}
.nav button.active{background:rgba(255,255,255,.17);color:#fff;font-weight:700}
.nav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:10px 12px 14px;border-top:1px solid rgba(255,255,255,.12)}
.user-pill{display:flex;align-items:center;gap:8px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.uname{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.88);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{background:rgba(255,255,255,.14);border:none;color:rgba(255,255,255,.8);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:var(--font);flex-shrink:0}
.btn-logout:hover{background:rgba(255,255,255,.24);color:#fff}

/* ── MAIN WRAP ── */
.main-wrap{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}

/* ── MOBILE TOPBAR ── */
.topbar{display:none;background:var(--green);color:#fff;height:var(--topbar-h);padding:0 16px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:90;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar-title{font-size:17px;font-weight:800;letter-spacing:.2px}
.topbar-right{display:flex;align-items:center;gap:8px}
.topfinca-tag{font-size:10.5px;color:rgba(255,255,255,.7)}

/* ── CONTENT ── */
.content{flex:1;padding:22px 26px;max-width:1300px;width:100%}

/* ── BOTTOM NAV ── */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bnav-h);background:#fff;border-top:1px solid var(--gray-mid);z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.07)}
.bottom-nav-inner{display:flex;height:100%}
.bnav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--gray2);font-family:var(--font);font-size:10px;font-weight:500;padding:8px 4px;transition:color .14s;position:relative}
.bnav-btn.active{color:var(--green)}
.bnav-btn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;background:var(--green);border-radius:0 0 3px 3px}
.bnav-icon{font-size:19px;line-height:1}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(var(--bnav-h) + 14px);right:16px;width:50px;height:50px;border-radius:50%;background:var(--amber);color:#fff;border:none;font-size:26px;font-weight:300;cursor:pointer;z-index:99;box-shadow:0 4px 16px rgba(196,123,26,.45);align-items:center;justify-content:center;transition:transform .14s,box-shadow .14s;display:none}
.fab:hover{transform:scale(1.06);box-shadow:0 6px 20px rgba(196,123,26,.55)}

/* ── NAV DRAWER ── */
.nav-drawer{position:fixed;inset:0;z-index:200;flex-direction:column;justify-content:flex-end;display:none}
.drawer-overlay{flex:1;background:rgba(0,0,0,.42)}
.drawer-sheet{background:#fff;border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:14px 16px 20px;box-shadow:0 -4px 24px rgba(0,0,0,.14)}
.drawer-handle{width:36px;height:4px;border-radius:2px;background:var(--gray-mid);margin:0 auto 14px}
.drawer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.drawer-item{background:var(--gray-pale);border:1px solid var(--gray-mid);border-radius:var(--radius);padding:14px 8px;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--gray);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .14s,border-color .14s}
.drawer-item:hover{background:var(--green-pale);border-color:var(--green-light);color:var(--green)}
.drawer-item .di-icon{font-size:20px}

/* ── CARDS ── */
.cards{display:grid;gap:10px;margin-bottom:16px}
.cards-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:#fff;border-radius:var(--radius);padding:14px 16px;border:1px solid var(--gray-mid);box-shadow:var(--shadow-sm)}
.card .lbl{font-size:9.5px;color:var(--gray2);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:5px}
.card .val{font-size:20px;font-weight:700;font-family:var(--mono);line-height:1.15;color:var(--gray)}
.card .sub{font-size:10.5px;color:var(--gray2);margin-top:3px}
.card.g{border-left:3px solid var(--green)}.card.g .val{color:var(--green)}
.card.r{border-left:3px solid var(--red)}.card.r .val{color:var(--red)}
.card.a{border-left:3px solid var(--amber)}.card.a .val{color:var(--amber)}
.card.b{border-left:3px solid var(--blue)}.card.b .val{color:var(--blue)}
.card.p{border-left:3px solid var(--purple)}.card.p .val{color:var(--purple)}
.card.t{border-left:3px solid var(--teal)}.card.t .val{color:var(--teal)}

/* ── FILTERS ── */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:#fff;border:1px solid var(--gray-mid);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.filters label{font-size:11px;color:var(--gray2);font-weight:500}
.filters select,.filters input[type=text]{font-family:var(--font);font-size:12.5px;padding:5px 9px;border:1px solid var(--gray-mid);border-radius:var(--radius-sm);background:var(--gray-pale);color:var(--gray);font-weight:500}
.filters select:focus,.filters input[type=text]:focus{outline:none;border-color:var(--green);background:#fff}

/* ── BUTTONS ── */
.btn{font-family:var(--font);font-size:12.5px;padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;border:none;transition:all .14s;letter-spacing:-.01em}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{background:#155535}
.btn-o{background:#fff;border:1.5px solid var(--gray-mid)!important;color:var(--gray)}.btn-o:hover{background:var(--gray-pale)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:#143d6b}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--gray-mid);border-radius:var(--radius);margin-bottom:14px;background:#fff;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead tr{background:var(--gray-pale)}
th{padding:9px 12px;text-align:left;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray2);border-bottom:1px solid var(--gray-mid)}
td{padding:9px 12px;border-bottom:.5px solid var(--gray-mid);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfd}
.num{font-family:var(--mono);font-size:12px}

/* ── TAGS ── */
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10.5px;font-weight:600}
.tg{background:var(--red-pale);color:var(--red)}.ti{background:var(--green-pale);color:var(--green)}
.tf{background:var(--blue-pale);color:var(--blue)}.tt{background:var(--purple-pale);color:var(--purple)}
.ta{background:var(--amber-pale);color:var(--amber)}.tk{background:var(--teal-pale);color:var(--teal)}

/* ── FORMS ── */
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fg3{grid-template-columns:repeat(3,1fr)}
.fi{display:flex;flex-direction:column;gap:4px}
.fi.full{grid-column:1/-1}
.fi label{font-size:11px;font-weight:600;color:var(--gray2)}
.fi input,.fi select,.fi textarea{font-family:var(--font);font-size:13px;padding:8px 10px;border:1.5px solid var(--gray-mid);border-radius:var(--radius-sm);color:var(--gray);background:#fff;transition:border-color .14s}
.fi input:focus,.fi select:focus,.fi textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(26,107,66,.09)}
.fi .hint{font-size:10px;color:#aaa}
.fi .calc{font-size:11.5px;color:var(--green);font-weight:600;background:var(--green-pale);padding:6px 10px;border-radius:var(--radius-sm);margin-top:2px;font-family:var(--mono)}

/* ── SECTION TITLES ── */
.stitle{font-size:11px;font-weight:700;color:var(--gray2);margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--gray-mid);text-transform:uppercase;letter-spacing:.6px}
.stitle.amber{border-bottom-color:var(--amber);color:var(--amber)}
.stitle.blue{border-bottom-color:var(--blue);color:var(--blue)}

/* ── CHARTS ── */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.cbox{border:1px solid var(--gray-mid);border-radius:var(--radius);padding:14px;background:#fff;box-shadow:var(--shadow-sm)}
.cbox h3{font-size:11.5px;font-weight:600;color:var(--gray2);margin-bottom:10px}

/* ── MISC ── */
.empty{text-align:center;padding:40px 16px;color:#bbb;font-size:13px}
.info-box{background:var(--teal-pale);border-left:3px solid var(--teal);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--teal)}
.pbar-wrap{display:flex;align-items:center;gap:6px}
.pbar{height:6px;border-radius:3px;min-width:4px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:var(--radius-lg);padding:20px;width:96%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mh h2{font-size:15px;font-weight:700}
.mc{background:var(--gray-pale);border:none;width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--gray2);display:flex;align-items:center;justify-content:center;line-height:1;transition:background .14s}
.mc:hover{background:var(--red-pale);color:var(--red)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;border-top:1px solid var(--gray-mid);padding-top:14px}

/* ── BADGES ── */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}
.bdg-p{background:var(--green-pale);color:var(--green)}.bdg-n{background:var(--red-pale);color:var(--red)}

/* ── DERIVADOS ── */
.deriv-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.deriv-card{border:1px solid var(--gray-mid);border-radius:var(--radius);padding:12px;text-align:center;background:#fff;box-shadow:var(--shadow-sm)}
.deriv-card .dname{font-size:10.5px;font-weight:700;margin-bottom:5px;color:var(--gray2)}
.deriv-card .dqq{font-size:17px;font-weight:700;font-family:var(--mono)}
.deriv-card .dprice{font-size:10.5px;color:var(--gray2);margin-top:3px}

/* ── CICLOS ── */
.ciclo-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.ciclo-card{border:1px solid var(--gray-mid);border-radius:var(--radius);padding:14px;cursor:pointer;transition:border-color .14s,box-shadow .14s;position:relative;background:#fff}
.ciclo-card:hover{border-color:var(--green);box-shadow:0 4px 12px rgba(26,107,66,.1)}
.ciclo-card .cn{font-weight:700;font-size:14px}
.ciclo-card .cm{font-size:11.5px;color:var(--gray2);margin-top:3px}
.status-pill{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-left:6px}
.st-activo{background:var(--green-pale);color:var(--green)}
.st-cerrado{background:var(--gray-mid);color:var(--gray2)}
.st-cosecha{background:var(--amber-pale);color:var(--amber)}

/* ── SPINNER ── */
.spinner{width:34px;height:34px;border:3px solid var(--gray-mid);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--green) 0%,#0F4A2C 100%);position:fixed;inset:0;z-index:9999}
.login-box{background:#fff;border-radius:var(--radius-lg);padding:40px 36px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
.login-box .logo{font-size:34px;font-weight:800;color:var(--green);margin-bottom:2px;letter-spacing:-.5px}
.login-box .sub{color:var(--gray2);font-size:12px;margin-bottom:26px}
.login-box input{width:100%;padding:10px 14px;border:1.5px solid var(--gray-mid);border-radius:var(--radius-sm);font-family:var(--font);font-size:14px;margin-bottom:10px;outline:none;text-align:left;display:block;box-sizing:border-box;transition:border-color .14s}
.login-box input:focus{border-color:var(--green)}
.btn-login{width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;font-family:var(--font);transition:background .14s}
.btn-login:hover{background:#155535}
.login-err{color:var(--red);font-size:12px;margin-top:10px;display:none}

/* ── USER PILL (sidebar context) ── */
.user-pill{display:flex;align-items:center;gap:8px}
.user-pill .uname{font-weight:600}
.btn-logout{background:rgba(255,255,255,.14);border:none;color:rgba(255,255,255,.8);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:var(--font)}
.btn-logout:hover{background:rgba(255,255,255,.24)}

/* ── PROCESO / TRILLO ── */
.trillo-tabs{display:flex;gap:0;margin-bottom:16px;border:1.5px solid var(--gray-mid);border-radius:var(--radius);overflow:hidden;background:#fff}
.trillo-tab{flex:1;padding:10px 8px;text-align:center;font-size:12.5px;font-weight:500;cursor:pointer;background:#fff;border:none;font-family:var(--font);color:var(--gray2);transition:all .14s}
.trillo-tab.active{background:var(--green);color:#fff;font-weight:700}
.trillo-tab:not(:last-child){border-right:1px solid var(--gray-mid)}
.tab-badge{display:inline-block;background:rgba(0,0,0,.1);color:inherit;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:700}
.trillo-tab.active .tab-badge{background:rgba(255,255,255,.25);color:#fff}
.st-en_proceso{background:#FEF3C7;color:#B45309}
.st-preseco{background:var(--red-pale);color:var(--red)}
.st-seco{background:var(--green-pale);color:var(--green)}
.st-parcial{background:var(--amber-pale);color:var(--amber)}
.st-completado{background:var(--teal-pale);color:var(--teal)}
.viaje-select-box{background:var(--green-pale);border:1.5px solid var(--green-light);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.viaje-select-box label{font-size:10.5px;font-weight:700;color:var(--green);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.viaje-select-box select{width:100%;padding:8px 10px;border:1px solid var(--gray-mid);border-radius:var(--radius-sm);font-family:var(--font);font-size:13px;background:#fff}

/* ── ACTION BUTTONS ── */
.btn-edit{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;font-family:var(--font);cursor:pointer;border:none;background:rgba(27,79,138,.08);color:var(--blue);transition:background .14s}
.btn-edit:hover{background:rgba(27,79,138,.16)}
.btn-del{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:700;font-family:var(--font);cursor:pointer;border:none;background:rgba(192,57,43,.08);color:var(--red);transition:background .14s;line-height:1}
.btn-del:hover{background:rgba(192,57,43,.18)}
.btn-actions{display:flex;align-items:center;gap:5px;white-space:nowrap}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .sidebar{display:none}
  .topbar{display:flex}
  .main-wrap{margin-left:0;padding-bottom:var(--bnav-h)}
  .content{padding:14px}
  .bottom-nav{display:block}
  .fab{display:flex!important}
  .cards-4{grid-template-columns:repeat(2,1fr)}
  .cards-3{grid-template-columns:repeat(2,1fr)}
  .cards-5{grid-template-columns:repeat(2,1fr)}
  .fg{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr}
  .charts-grid{grid-template-columns:1fr}
  .deriv-grid{grid-template-columns:repeat(2,1fr)}
  .ciclo-list{grid-template-columns:1fr}
  .modal-overlay{align-items:flex-end}
  .modal{border-radius:var(--radius-lg) var(--radius-lg) 0 0;max-height:95vh}
}
@media(min-width:769px){
  .bottom-nav{display:none!important}
  .fab{display:none!important}
  .nav-drawer{display:none!important}
}
</style>
</head>
<body>
<div id="app">

  <!-- SIDEBAR (PC) -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">T</div>
      <div><div class="logo-name">TARS</div><div class="logo-sub">Gestión Arrocera</div></div>
    </div>
    <nav class="nav">
      <button class="active" onclick="T('dashboard')"><span class="nav-icon">📊</span>Dashboard</button>
      <button onclick="T('ciclos')"><span class="nav-icon">🔄</span>Ciclos</button>
      <button onclick="T('fincas')"><span class="nav-icon">📍</span>Fincas</button>
      <button onclick="T('campo')"><span class="nav-icon">🌱</span>Campo</button>
      <button onclick="T('cosecha')"><span class="nav-icon">🌾</span>Cosecha</button>

// SUPABASE REST
async function sbFetch(table,method,body,query){
  query=query||'';
  const opts={method:method||'GET',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+getToken(),'Content-Type':'application/json','Accept':'application/json'}};
  if(method==='POST')opts.headers['Prefer']='return=representation';
  if(method==='PATCH')opts.headers['Prefer']='return=representation';
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SUPA_URL+'/rest/v1/'+table+query,opts);
  if(r.status===204||method==='DELETE')return[];
  const text=await r.text();
  if(!text)return[];
  let data;
  try{data=JSON.parse(text);}catch(e){throw new Error('Invalid JSON: '+text.slice(0,100));}
  if(!r.ok)throw new Error(JSON.stringify(data));
  // Always return array
  return Array.isArray(data)?data:[data];
}
const sbGet=(t,q)=>sbFetch(t,'GET',null,q);

function calcQQseco(neto,hent,hobj){
  if(!neto||hent<=hobj)return neto;
  return neto*(100-hent)/(100-hobj);
}
function costoTrillo(t){
  const base=t.qq_seco||t.qq_neto_granza||0;
  const total=Object.values(t.tarifas||{}).reduce((s,v)=>s+(v||0),0);
  return base*total;
}
function gastosCampo(fi,ci){return S.gastos_campo.filter(g=>(fi==='all'||g.finca_id===fi)&&(ci==='all'||g.ciclo_id===ci)).reduce((s,g)=>s+g.monto,0)}
function costoTrilloTotal(fi,ci){return S.trillos.filter(t=>(fi==='all'||t.finca_id===fi)&&(ci==='all'||t.ciclo_id===ci)).reduce((s,t)=>s+costoTrillo(t),0)}
function ingresoVentas(fi,ci){return S.ventas.filter(v=>(fi==='all'||v.finca_id===fi)&&(ci==='all'||v.ciclo_id===ci)).reduce((s,v)=>s+v.qq_vendidos*v.precio_qq,0)}
function qqCosechados(fi,ci){return S.cosechas.filter(c=>(fi==='all'||c.finca_id===fi)&&(ci==='all'||c.ciclo_id===ci)).reduce((s,c)=>s+c.qq_cosechados,0)}
function derivadosTotales(fi,ci){
  const tot={arroz_entero:0,semolina:0,puntilla:0,pallana:0,fina:0};
  S.trillos.filter(t=>(fi==='all'||t.finca_id===fi)&&(ci==='all'||t.ciclo_id===ci)).forEach(t=>DERIVADOS.forEach(d=>{tot[d]+=(t.derivados[d]||0)}));
  return tot;
}
function kpis(fi,ci){
  const gc=gastosCampo(fi,ci);const ct=costoTrilloTotal(fi,ci);const gastos=gc+ct;const ing=ingresoVentas(fi,ci);
  return{gc,ct,gastos,ing,utilidad:ing-gastos,margen:ing>0?(ing-gastos)/ing*100:0,qq:qqCosechados(fi,ci)};
}
function costoPorQQ(fi,ci){
  const k=kpis(fi,ci);
  const tFilt=S.trillos.filter(t=>(fi==='all'||t.finca_id===fi)&&(ci==='all'||t.ciclo_id===ci));
  const totSeco=tFilt.reduce((s,t)=>s+(t.qq_seco||0),0);
  const deriv=derivadosTotales(fi,ci);
  const qqAE=deriv.arroz_entero||0;
  const vs=S.ventas.filter(v=>(fi==='all'||v.finca_id===fi)&&(ci==='all'||v.ciclo_id===ci));
  const qqVendido=vs.reduce((s,v)=>s+v.qq_vendidos,0);
  const promVenta=qqVendido>0?vs.reduce((s,v)=>s+v.qq_vendidos*v.precio_qq,0)/qqVendido:0;
  const costoQQseco=totSeco>0?(k.gastos/totSeco):0;
  const costoQQae=qqAE>0?(k.gastos/qqAE):0;
  const margenQQ=promVenta>0&&costoQQseco>0?(promVenta-costoQQseco):0;
  return{costoQQseco,costoQQae,promVenta,margenQQ,totSeco,qqAE};
}

function rCosecha(){
  const fi=S.filtroFinca,ci=S.filtroCiclo;
  const cos=S.cosechas.filter(c=>(fi==='all'||c.finca_id===fi)&&(ci==='all'||c.ciclo_id===ci));
  const totalQQ=cos.reduce((s,c)=>s+c.qq_cosechados,0);
  const promHum=cos.length?cos.reduce((s,c)=>s+c.humedad,0)/cos.length:0;
  // QQ por manzana: total QQ / total manzanas of filtered fincas
  const mzTotal=(fi==='all'?S.fincas.reduce((s,f)=>s+f.manzanas,0):S.fincas.filter(f=>f.id===fi).reduce((s,f)=>s+f.manzanas,0));
  const qqPorMz=mzTotal>0&&totalQQ>0?(totalQQ/mzTotal).toFixed(1)+' qq/mz':'--';
  document.getElementById('content').innerHTML=`
    <div class="filters"><label>Finca:</label><select onchange="setF('finca',this.value)">${fincaOpts(fi)}</select><label>Ciclo:</label><select onchange="setF('ciclo',this.value)">${cicloOpts(ci)}</select><button class="btn btn-g" onclick="openModal('cosecha')">+ Registrar cosecha</button></div>
    <div class="info-box">La humedad al corte determina la merma. A mayor humedad, mas peso se pierde al secar. El punto optimo de secado es entre 12 y 12.5 grados.</div>
    <div class="cards cards-4"><div class="card g"><div class="lbl">Total cosechado</div><div class="val">${fmtQQ(totalQQ)}</div></div><div class="card t"><div class="lbl">Rendimiento promedio</div><div class="val" style="font-size:14px">${qqPorMz}</div><div class="sub">qq granza / manzana</div></div><div class="card b"><div class="lbl">Lotes</div><div class="val">${cos.length}</div></div><div class="card a"><div class="lbl">Humedad promedio</div><div class="val">${promHum.toFixed(1)}°</div></div></div>
    <div class="stitle">Registros de cosecha</div>
    <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Finca</th><th>Ciclo</th><th>QQ cosechados</th><th>Humedad corte</th><th>QQ secos est. (12.5°)</th><th>Merma est.</th><th>Notas</th><th></th></tr></thead>
    <tbody>${cos.length?cos.map(c=>{const qs=calcQQseco(c.qq_cosechados,c.humedad,12.5);const merma=c.qq_cosechados-qs;return`<tr><td class="num">${c.fecha}</td><td><span class="tag tf">${gF(c.finca_id).nombre}</span></td><td style="font-size:11px;color:var(--gray2)">${c.ciclo_id?gC(c.ciclo_id).nombre:'--'}</td><td class="num" style="color:var(--green);font-weight:600">${c.qq_cosechados} qq</td><td class="num">${c.humedad}°</td><td class="num" style="color:var(--teal)">${qs.toFixed(1)} qq</td><td class="num" style="color:var(--red)">-${merma.toFixed(1)} qq</td><td style="font-size:11px;color:#999">${c.notas||'--'}</td><td><button class="btn-del" onclick="delItem('cosechas','${c.id}')" title="Eliminar">✕</button></td></tr>`}).join(''):`<tr><td colspan="9" class="empty">Sin cosechas</td></tr>`}</tbody></table></div>`;
}

      <div class="card g"><div class="lbl">Flete prom. por qq</div><div class="val">${(()=>{const withFlete=basculas.filter(b=>b.precio_flete_qq>0);return withFlete.length?'C$ '+(withFlete.reduce((s,b)=>s+(b.precio_flete_qq||0),0)/withFlete.length).toFixed(2)+'\'/qq':'--';})()}</div></div>

function rTrillo(){
  const fi=S.filtroFinca,ci=S.filtroCiclo;
  const tab=S.trilloTab||'secado';
  const nS=(S.secados||[]).filter(x=>(fi==='all'||x.finca_id===fi)&&(ci==='all'||x.ciclo_id===ci)).length;
  const nE=(S.embodegados||[]).filter(x=>(fi==='all'||x.finca_id===fi)&&(ci==='all'||x.ciclo_id===ci)).length;
  const nT=S.trillos.filter(x=>(fi==='all'||x.finca_id===fi)&&(ci==='all'||x.ciclo_id===ci)).length;
  const tabs=[['secado','1. Secado',nS],['embodegado','2. Embodegado',nE],['trillado','3. Trillado',nT]];
  document.getElementById('content').innerHTML=`
    <div class="filters"><label>Finca:</label><select onchange="setF('finca',this.value)">${fincaOpts(fi)}</select><label>Ciclo:</label><select onchange="setF('ciclo',this.value)">${cicloOpts(ci)}</select></div>
    <div class="trillo-tabs">${tabs.map(([k,lbl,n])=>`<button class="trillo-tab ${tab===k?'active':''}" onclick="setTrilloTab('${k}')">${lbl}<span class="tab-badge">${n}</span></button>`).join('')}</div>
    <div id="proceso-content"></div>`;
  renderProcesoTab(tab);
}
function setTrilloTab(tab){S.trilloTab=tab;document.querySelectorAll('.trillo-tab').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.trillo-tab').forEach(b=>{if(b.onclick&&b.getAttribute('onclick')&&b.getAttribute('onclick').includes("'"+tab+"'"))b.classList.add('active');});renderProcesoTab(tab);}
function renderProcesoTab(tab){if(tab==='secado')rSecado();else if(tab==='embodegado')rEmbodegado();else rTrillado();}
function delItemTabla(arr,id,tab){if(!confirm('Eliminar este registro?'))return;const tbls={secados:'secados',embodegados:'embodegados',trillos:'trillos'};const tbl=tbls[arr];if(tbl)sbDelete(tbl,id).catch(e=>alert('Error: '+e.message));S[arr]=(S[arr]||[]).filter(x=>x.id!==id);renderProcesoTab(tab);}

// helpers
const getTicket=id=>S.basculas.find(x=>x.id===id);
const ticketLabel=id=>{const b=getTicket(id);return b?`#${b.no_ticket} — ${gF(b.finca_id).nombre} (${(b.qq_neto||0).toFixed(1)} qq granza)`:id||'--';};
const estadoPill=(e,map)=>{const cfg={en_proceso:{lbl:'En proceso',cls:'en_proceso'},preseco:{lbl:'Pre-seco',cls:'preseco'},seco:{lbl:'Seco',cls:'seco'},parcial:{lbl:'Parcial',cls:'parcial'},completado:{lbl:'Completado',cls:'completado'}};const c=cfg[e]||{lbl:e,cls:'en_proceso'};return`<span class="status-pill st-${c.cls}">${c.lbl}</span>`;};

function rSecado(){
  const fi=S.filtroFinca,ci=S.filtroCiclo;
  const list=(S.secados||[]).filter(x=>(fi==='all'||x.finca_id===fi||(!x.finca_id&&fi==='all'))&&(ci==='all'||x.ciclo_id===ci||(!x.ciclo_id&&ci==='all'))).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const totSeco=list.reduce((s,x)=>s+(x.qq_seco||0),0);
  const enProceso=list.filter(x=>x.estado==='en_proceso').length;
  const preseco=list.filter(x=>x.estado==='preseco').length;
  const completados=list.filter(x=>x.estado==='seco').length;
  document.getElementById('proceso-content').innerHTML=`
    <div class="cards cards-4">
      <div class="card t"><div class="lbl">QQ secos total</div><div class="val">${fmtQQ(totSeco)}</div></div>
      <div class="card a"><div class="lbl">En proceso</div><div class="val">${enProceso}</div></div>
      <div class="card r"><div class="lbl">Pre-secos</div><div class="val">${preseco}</div></div>
      <div class="card g"><div class="lbl">Completados</div><div class="val">${completados}</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="stitle" style="margin:0;border:none">Registros de secado por viaje</div>
      <button class="btn btn-g" onclick="openSecadoModal()">+ Registrar secado</button>
    </div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Ticket / Viaje</th><th>Fecha</th><th>Metodo</th><th>Ubicacion</th>
      <th>Hum. ent.</th><th>Hum. obj.</th><th>QQ granza</th><th>QQ secos</th><th>Merma</th>
      <th>Desc.</th><th>C$ secado</th><th>Estado</th><th></th>
    </tr></thead><tbody>${list.length?list.map(x=>{
      const b=getTicket(x.bascula_id);
      const qqNeto=b?b.qq_neto:0;
      const merma=qqNeto-(x.qq_seco||0);
      const descTotal=(x.precio_descargue||0);
      const costoSec=x.metodo==='secadora'?(x.precio_secado||0)*(x.qq_seco||0):(x.precio_secado||0)*(x.qq_seco||0);
      const ubic=x.metodo==='secadora'?('Silo '+(x.numero||'')): ('Patio '+(x.numero||'')+(x.tipo_patio==='preseco'?' (P/S)':''));
      return`<tr>
        <td><span class="tag tk" style="font-size:10px">${ticketLabel(x.bascula_id)}</span></td>
        <td class="num">${x.fecha}</td>
        <td><span class="tag ${x.metodo==='secadora'?'tt':'ta'}">${x.metodo==='secadora'?'Secadora':'Patio'}</span></td>
        <td style="font-size:11px">${ubic}</td>
        <td class="num">${x.humedad_entrada||0}°</td>
        <td class="num">${x.humedad_objetivo||12.5}°</td>
        <td class="num">${qqNeto.toFixed(1)} qq</td>
        <td class="num" style="color:var(--teal);font-weight:600">${(x.qq_seco||0).toFixed(1)} qq</td>
        <td class="num" style="color:var(--red)">-${merma.toFixed(1)} qq</td>
        <td class="num">${C$(descTotal)}</td>
        <td class="num">${C$(costoSec)}</td>
        <td>${estadoPill(x.estado)}</td>
        <td style="white-space:nowrap">
          <div class="btn-actions"><button class="btn-edit" onclick="openSecadoModal('${x.id}')">✏ Editar</button><button class="btn-del" onclick="delItemTabla('secados','${x.id}','secado')" title="Eliminar">✕</button></div>
        </td>
      </tr>`;
    }).join(''):`<tr><td colspan="13" class="empty">Sin registros de secado. Comienza registrando un viaje.</td></tr>`}</tbody></table></div>`;
}

function toggleSecMetodo(){
  const m=document.getElementById('m-metodo').value;
  document.getElementById('sec-patio').style.display=m==='patio'?'block':'none';
  document.getElementById('sec-silo').style.display=m==='secadora'?'block':'none';
  calcSecMerma();
}

function onTicketChange(sel,ctx){
  const b=S.basculas.find(x=>x.id===sel.value);
  if(ctx==='sec'){calcSecMerma();return;}
  if(!b)return;
  if(ctx==='emb'){
    // prefill qq from linked secado
    const sec=(S.secados||[]).find(x=>x.bascula_id===sel.value&&x.estado==='seco');
    if(sec){
      const qqEl=document.getElementById('m-qq-emb');
      if(qqEl&&!qqEl.value)qqEl.value=sec.qq_seco.toFixed(2);
    }
  }
}

function calcSecMerma(){
  const basId=document.getElementById('m-bascula')?.value;
  const b=basId?S.basculas.find(x=>x.id===basId):null;
  const qqNeto=b?b.qq_neto:0;
  const hent=parseFloat(document.getElementById('m-hent')?.value)||22;
  const hobj=parseFloat(document.getElementById('m-hobj')?.value)||12.5;
  const el=document.getElementById('sec-merma-preview');
  if(!el)return;
  if(qqNeto>0){
    const seco=hent>hobj?calcQQseco(qqNeto,hent,hobj):qqNeto;
    const merma=qqNeto-seco;
    el.textContent='QQ neto granza: '+qqNeto.toFixed(1)+' qq  →  QQ secos estimados: '+seco.toFixed(1)+' qq  |  Merma: '+merma.toFixed(1)+' qq ('+((merma/qqNeto)*100).toFixed(1)+'%)';
    el.style.display='block';
    el.dataset.qqseco=seco.toFixed(2);
  }else{
    el.textContent='Selecciona un ticket para ver el calculo de merma';
    el.style.display='block';
    delete el.dataset.qqseco;
  }
}

function getSecadoRec(){
  const basId=document.getElementById('m-bascula')?.value;
  if(!basId){alert('Selecciona un ticket de bascula');return null;}
  const b=S.basculas.find(x=>x.id===basId);
  if(!b){alert('Ticket no encontrado');return null;}
  const metodo=document.getElementById('m-metodo').value;
  const hent=parseFloat(document.getElementById('m-hent').value)||22;
  const hobj=parseFloat(document.getElementById('m-hobj').value)||12.5;
  // Always calculate qqSeco from formula, don't rely on UI preview element
  const qqSecoCalc=calcQQseco(b.qq_neto,hent,hobj);
  const previewEl=document.getElementById('sec-merma-preview');
  const qqSeco=previewEl&&previewEl.dataset.qqseco?parseFloat(previewEl.dataset.qqseco):qqSecoCalc;
  const numero=metodo==='patio'?document.getElementById('m-numero-patio')?.value:document.getElementById('m-numero-silo')?.value;
  const precio_descargue=metodo==='patio'?parseFloat(document.getElementById('m-desc-patio')?.value||0):parseFloat(document.getElementById('m-desc-silo')?.value||0);
  const precio_secado=metodo==='patio'?parseFloat(document.getElementById('m-precio-sec-patio')?.value||0):parseFloat(document.getElementById('m-precio-sec-silo')?.value||0);
  const tipo_patio=metodo==='patio'?document.getElementById('m-tipo-patio')?.value:'';
  const de_preseco=metodo==='secadora'&&document.getElementById('m-de-preseco')?.value==='si';
  return{bascula_id:basId,finca_id:b.finca_id,ciclo_id:b.ciclo_id,fecha:document.getElementById('m-fecha').value,metodo,numero:numero||'',tipo_patio,precio_descargue,precio_secado,de_preseco,humedad_entrada:hent,humedad_objetivo:hobj,qq_seco:parseFloat(qqSeco),estado:document.getElementById('m-estado').value,notas:document.getElementById('m-notas').value||''};
}

async function saveSecado(){
  const rec=getSecadoRec();if(!rec)return;
  try{
    const result=await sbPost('secados',rec);
    const saved=Array.isArray(result)?result[0]:result;
    if(!saved){alert('Error: No se recibio confirmacion de Supabase');return;}
    S.secados=S.secados||[];
    S.secados.unshift(saved);
    CM();rSecado();
  }catch(e){alert('Error al guardar secado: '+e.message);}
}
async function updateSecado(id){
  const rec=getSecadoRec();if(!rec)return;
  try{await sbPatch('secados',id,rec);const idx=(S.secados||[]).findIndex(x=>x.id===id);if(idx>=0)Object.assign(S.secados[idx],rec);CM();rSecado();}

}

async function saveTrillado2(){
  const rec=getTrilladoRec();if(!rec)return;
  try{
    const[saved]=await sbPost('trillos',rec);
    saved.tarifas=JSON.parse(saved.tarifas||'{}');
    saved.derivados=JSON.parse(saved.derivados||'{}');
    S.trillos.unshift(saved);CM();rTrillado();
  }catch(e){alert('Error: '+e.message);}

async function updateTrillado(id){
  const rec=getTrilladoRec();if(!rec)return;
  try{
    await sbPatch('trillos',id,rec);
    const idx=S.trillos.findIndex(x=>x.id===id);
    if(idx>=0){
      const parsed={...rec,tarifas:JSON.parse(rec.tarifas||'{}'),derivados:JSON.parse(rec.derivados||'{}')};
      Object.assign(S.trillos[idx],parsed);
    }
    CM();rTrillado();
  }catch(e){alert('Error: '+e.message);}
}

// Live calculators
function calcMermaC(){const qq=parseFloat(document.getElementById('m-qq')?.value)||0;const h=parseFloat(document.getElementById('m-hum')?.value)||0;const el=document.getElementById('prev-merma-c');if(!el)return;if(qq>0&&h>12.5){const s=calcQQseco(qq,h,12.5);el.textContent='Estimado seco a 12.5°: '+s.toFixed(1)+' qq  |  Merma: '+(qq-s).toFixed(1)+' qq';el.style.display='block';}else el.style.display='none';}
function calcNeto(){const br=parseFloat(document.getElementById('m-bruto')?.value)||0;const ta=parseFloat(document.getElementById('m-tara')?.value)||0;const el=document.getElementById('prev-neto');if(!el)return;if(br>0&&ta>0){el.textContent='QQ neto granza: '+(br-ta).toFixed(1)+' qq  ('+br+' - '+ta+')';el.style.display='block';calcMermaT();}else el.style.display='none';}
function calcMermaT(){const br=parseFloat(document.getElementById('m-bruto')?.value)||0;const ta=parseFloat(document.getElementById('m-tara')?.value)||0;const neto=br-ta;const he=parseFloat(document.getElementById('m-hent')?.value)||0;const ho=parseFloat(document.getElementById('m-hobj')?.value)||12.5;const el=document.getElementById('prev-merma-t');if(!el)return;if(neto>0&&he>ho){const s=calcQQseco(neto,he,ho);el.textContent='QQ secos: '+s.toFixed(1)+'  |  Merma: '+(neto-s).toFixed(1)+' qq ('+((neto-s)/neto*100).toFixed(1)+'%)';el.style.display='block';calcCostoT();}else el.style.display='none';}
function calcCostoT(){const br=parseFloat(document.getElementById('m-bruto')?.value)||0;const ta=parseFloat(document.getElementById('m-tara')?.value)||0;const neto=br-ta;const he=parseFloat(document.getElementById('m-hent')?.value)||0;const ho=parseFloat(document.getElementById('m-hobj')?.value)||12.5;const seco=neto>0&&he>ho?calcQQseco(neto,he,ho):neto;const total=['descargue','secado','mov_patio_bodega','mov_bodega_pila','trillado'].reduce((s,k)=>s+(parseFloat(document.getElementById('m-t-'+k)?.value)||0),0);const costo=seco*total;const el=document.getElementById('prev-costo-t');if(!el)return;if(seco>0&&total>0){el.textContent='Costo estimado: '+C$(costo)+' ('+seco.toFixed(1)+' qq x C$'+total+'/qq)';el.style.display='block';}else el.style.display='none';}

function calcNetoB(){
  const br=parseFloat(document.getElementById('m-bruto')?.value)||0;
  const ta=parseFloat(document.getElementById('m-tara')?.value)||0;
  const el=document.getElementById('prev-neto-b');
  if(!el)return;
  if(br>0&&ta>0){
    el.textContent='QQ Neto: '+(br-ta).toFixed(2)+' qq  ('+br.toFixed(2)+' - '+ta.toFixed(2)+')';
    el.style.display='block';
  }else el.style.display='none';
  calcFleteTotal();
  calcCostoGranza();
}
function toggleOrigenViaje(){
  const v=document.getElementById('m-origen-viaje')?.value;
  const el=document.getElementById('granza-comprada-fields');
  if(el)el.style.display=v==='comprado'?'block':'none';
}
function calcCostoGranza(){
  const br=parseFloat(document.getElementById('m-bruto')?.value)||0;
  const ta=parseFloat(document.getElementById('m-tara')?.value)||0;
  const qqNeto=Math.max(0,br-ta);
  const precio=parseFloat(document.getElementById('m-precio-granza')?.value)||0;
  const el=document.getElementById('prev-granza');
  if(!el)return;
  if(precio>0&&qqNeto>0){
    const total=precio*qqNeto;
    el.textContent='C$ '+Math.round(total).toLocaleString('es-NI')+' costo total granza  ('+qqNeto.toFixed(2)+' qq × C$'+precio+'/qq)';
  }else{
    el.textContent='Ingresa precio por qq y los pesos en bascula';
  }
}
function calcFleteTotal(){
  const neto=parseFloat(document.getElementById('prev-neto-b')?.textContent?.match(/[\d.]+/)?.[0])||0;
  const br=parseFloat(document.getElementById('m-bruto')?.value)||0;
  const ta=parseFloat(document.getElementById('m-tara')?.value)||0;
  const qqNeto=neto||Math.max(0,br-ta);
  const precio=parseFloat(document.getElementById('m-flete-qq')?.value)||0;
  const el=document.getElementById('prev-flete');
  if(!el)return;
  if(precio>0&&qqNeto>0){
    const total=precio*qqNeto;
    el.textContent='C$ '+Math.round(total).toLocaleString('es-NI')+' total  ('+qqNeto.toFixed(2)+' qq × C$'+precio+'/qq)';
  }else{
    el.textContent='Ingresa precio por qq y pesos en bascula';
  }
}

  const bruto=parseFloat(document.getElementById('m-bruto')?.value)||0;

  if(!bruto||!tara){alert('Ingresa peso bruto y tara');return}

async function updateBascula(id){
  const bruto=parseFloat(document.getElementById('m-bruto')?.value)||0;
  const tara=parseFloat(document.getElementById('m-tara')?.value)||0;
  if(!bruto||!tara){alert('Ingresa peso bruto y tara');return}
  if(!v('m-ticket')){alert('Ingresa el numero de ticket');return}
  const neto=parseFloat((bruto-tara).toFixed(2));
  const fId=v('m-finca');const cId=v('m-ciclo');
  const fleteQQ=parseFloat(document.getElementById('m-flete-qq')?.value)||0;
  const origenV=document.getElementById('m-origen-viaje')?.value||'propio';
  const precioGranzaU=origenV==='comprado'?parseFloat(document.getElementById('m-precio-granza')?.value)||0:0;
  const rec={
    no_ticket:v('m-ticket'),fecha:v('m-fecha'),hora:v('m-hora'),
    finca_id:fId&&fId!=='all'?fId:null,ciclo_id:cId||null,
    nombre_productor:v('m-productor'),placa:v('m-placa'),
    conductor:v('m-conductor'),peso_bruto:bruto,tara:tara,
    qq_neto:neto,precio_flete_qq:fleteQQ,costo_flete_total:parseFloat((fleteQQ*neto).toFixed(2)),
    origen_viaje:origenV,proveedor_granza:origenV==='comprado'?(document.getElementById('m-proveedor')?.value||''):'',
    precio_granza_qq:precioGranzaU,costo_granza_total:parseFloat((precioGranzaU*neto).toFixed(2)),
    beneficio:v('m-beneficio'),notas:v('m-notas')
  };
  try{
    await sbPatch('basculas',id,rec);
    const idx=S.basculas.findIndex(b=>b.id===id);
    if(idx>=0)Object.assign(S.basculas[idx],rec);
    CM();T('bascula');
  }catch(e){alert('Error: '+e.message);}
}

function fincaOpts(fi){return`<option value="all" ${fi==='all'?'selected':''}>Todas</option>${S.fincas.map(f=>`<option value="${f.id}" ${fi===f.id?'selected':''}>${f.nombre}</option>`).join('')}`}
function cicloOpts(ci){return`<option value="all" ${ci==='all'?'selected':''}>Todos</option>${S.ciclos.map(c=>`<option value="${c.id}" ${ci===c.id?'selected':''}>${c.nombre}</option>`).join('')}`}
function setF(tipo,val){if(tipo==='finca')S.filtroFinca=val;if(tipo==='ciclo')S.filtroCiclo=val;T(S.activeTab)}
async function delItem(arr,id){if(!confirm('Eliminar este registro?'))return;const tbls={gastos_campo:'gastos_campo',cosechas:'cosechas',ventas:'ventas',basculas:'basculas',trillos:'trillos',ciclos:'ciclos'};const tbl=tbls[arr];if(tbl)try{await sbDelete(tbl,id);}catch(e){alert('Error: '+e.message);return;}S[arr]=S[arr].filter(x=>x.id!==id);T(S.activeTab);}
async function delFinca(id){if(!confirm('Eliminar esta finca?'))return;try{await sbDelete('fincas',id);}catch(e){alert('Error: '+e.message);return;}S.fincas=S.fincas.filter(f=>f.id!==id);rFincas();}

function exportPDF(){

  const derivFilas=DERIVADOS.map(d=>{const vs=S.ventas.filter(v=>v.derivado===d&&(fi==='all'||v.finca_id===fi));const qv=vs.reduce((s,v)=>s+v.qq_vendidos,0);const ing=vs.reduce((s,v)=>s+v.qq_vendidos*v.precio_qq,0);return`<tr><td>${DNAMES[d]}</td><td>${deriv[d].toFixed(1)} qq</td><td>${qv.toFixed(1)} qq</td><td>${C$(ing)}</td></tr>`}).join('');
  const w=window.open('','_blank','width=900,height=700');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reporte P&L</title><style>body{font-family:Arial,sans-serif;font-size:12px;color:#333;padding:32px}h1{color:#1F7A4D;font-size:20px;margin-bottom:4px}h2{font-size:14px;color:#555;margin:20px 0 8px}.meta{font-size:11px;color:#888;margin-bottom:20px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.kcard{border:1px solid #ddd;border-radius:6px;padding:12px}.kcard .l{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}.kcard .v{font-size:18px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px}th{background:#f4f5f6;padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:#777;border-bottom:1px solid #ddd}td{padding:7px 10px;border-bottom:.5px solid #eee}.g{color:#1F7A4D}.r{color:#9B1C1C}.a{color:#B5621B}@media print{button{display:none}}

function toggleDrawer(){

  if(!d)return;
  const open=d.style.display==='flex';
  d.style.display=open?'none':'flex';
}

// FAB opens the most contextual form for the active tab
function openFabAction(){
  const tabMap={
    campo:'gasto_campo',cosecha:'cosecha',bascula:'bascula',ventas:'venta',
    ciclos:'ciclo',fincas:'finca'
  };
  const tipo=tabMap[S.activeTab];
  if(tipo)openModal(tipo);
  else if(S.activeTab==='trillo'){
    const subMap={secado:openSecadoModal,embodegado:openEmbodegadoModal,trillado:openTrilladoModal};
    const fn=subMap[S.trilloTab||'secado'];
    if(fn)fn();
  }
}

// Fix: doLogin sets display:'block' but layout needs 'flex'
(function(){
  const app=document.getElementById('app');
  if(!app)return;
  new MutationObserver(()=>{
    if(app.style.display==='block')app.style.display='flex';
  }).observe(app,{attributes:true,attributeFilter:['style']});
})();

// Sync avatar initial when user name is set
(function(){
  const nameEl=document.getElementById('user-name-tag');
  const avatarEl=document.getElementById('user-avatar');
  if(!nameEl||!avatarEl)return;
  new MutationObserver(()=>{
    const t=nameEl.textContent||'';
    if(t)avatarEl.textContent=t.charAt(0).toUpperCase();
  }).observe(nameEl,{childList:true,characterData:true,subtree:true});
})();
