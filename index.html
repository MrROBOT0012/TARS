<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARS — Sistema de Gestión Arrocera</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1F7A4D;--green2:#52B788;--green-pale:#D8F3DC;
  --amber:#B5621B;--amber-pale:#FDEBD0;
  --red:#9B1C1C;--red-pale:#FEE2E2;
  --blue:#1A4E8A;--blue-pale:#DBEAFE;
  --purple:#5B21B6;--purple-pale:#EDE9FE;
  --teal:#0F6E56;--teal-pale:#E1F5EE;
  --gray:#3D4451;--gray2:#6B7280;--gray-pale:#F4F5F6;--gray-mid:#E5E7EA;
  --font:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{font-family:var(--font);font-size:14px;color:var(--gray);background:#f0f2f5;min-height:100vh;padding:20px}
#app{border-radius:10px;overflow:hidden;border:1px solid var(--gray-mid);position:relative;max-width:1150px;margin:0 auto;background:#fff}
.topbar{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.topbar .sub{font-size:11px;opacity:.7;margin-top:1px}
.nav{display:flex;background:#fff;border-bottom:1.5px solid var(--gray-mid);padding:0 10px;gap:1px;overflow-x:auto}
.nav button{background:none;border:none;padding:8px 11px;font-size:12px;font-family:var(--font);cursor:pointer;color:var(--gray2);border-bottom:2px solid transparent;margin-bottom:-1.5px;white-space:nowrap;transition:all .15s}
.nav button.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.nav button:hover:not(.active){background:var(--gray-pale)}
.content{background:#fff;padding:14px;min-height:500px;border-radius:0 0 10px 10px}
.cards{display:grid;gap:8px;margin-bottom:14px}
.cards-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--gray-pale);border-radius:8px;padding:11px 13px}
.card .lbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.card .val{font-size:17px;font-weight:600;font-family:var(--mono);line-height:1.2}
.card .sub{font-size:10px;color:var(--gray2);margin-top:2px}
.card.g .val{color:var(--green)}.card.r .val{color:var(--red)}.card.a .val{color:var(--amber)}.card.b .val{color:var(--blue)}.card.p .val{color:var(--purple)}.card.t .val{color:var(--teal)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:9px 11px;background:var(--gray-pale);border-radius:8px}
.filters label{font-size:11px;color:#999;margin-right:1px}
.filters select,.filters input[type=text]{font-family:var(--font);font-size:12px;padding:4px 7px;border:1px solid var(--gray-mid);border-radius:5px;background:#fff;color:var(--gray)}
.btn{font-family:var(--font);font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:500;border:none}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{background:#175e3a}
.btn-o{background:#fff;border:1px solid var(--gray-mid)!important;color:var(--gray)}.btn-o:hover{background:var(--gray-pale)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{background:#123a6b}
.tbl-wrap{overflow-x:auto;border:1px solid var(--gray-mid);border-radius:8px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--gray-pale)}
th{padding:7px 10px;text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#999;border-bottom:1px solid var(--gray-mid)}
td{padding:7px 10px;border-bottom:.5px solid var(--gray-mid);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray-pale)}
.num{font-family:var(--mono);font-size:11px}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.tg{background:var(--red-pale);color:var(--red)}.ti{background:var(--green-pale);color:var(--green)}
.tf{background:var(--blue-pale);color:var(--blue)}.tt{background:var(--purple-pale);color:var(--purple)}
.ta{background:var(--amber-pale);color:var(--amber)}.tk{background:var(--teal-pale);color:var(--teal)}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fg3{grid-template-columns:repeat(3,1fr)}
.fi{display:flex;flex-direction:column;gap:3px}
.fi.full{grid-column:1/-1}
.fi label{font-size:11px;font-weight:500;color:#777}
.fi input,.fi select{font-family:var(--font);font-size:12px;padding:6px 9px;border:1px solid var(--gray-mid);border-radius:6px;color:var(--gray);background:#fff}
.fi input:focus,.fi select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(31,122,77,.1)}
.fi .hint{font-size:10px;color:#aaa;margin-top:1px}
.fi .calc{font-size:11px;color:var(--green);font-weight:600;background:var(--green-pale);padding:4px 8px;border-radius:4px;margin-top:2px}
.stitle{font-size:12px;font-weight:600;color:var(--gray);margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--gray-mid)}
.stitle.amber{border-bottom-color:var(--amber);color:var(--amber)}
.stitle.blue{border-bottom-color:var(--blue);color:var(--blue)}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.cbox{border:1px solid var(--gray-mid);border-radius:8px;padding:12px}
.cbox h3{font-size:12px;font-weight:500;margin-bottom:8px;color:var(--gray2)}
.empty{text-align:center;padding:36px 16px;color:#bbb;font-size:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:10px;padding:18px;width:96%;max-width:580px;max-height:90%;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh h2{font-size:14px;font-weight:600}
.mc{background:none;border:none;font-size:20px;cursor:pointer;color:#bbb;line-height:1}.mc:hover{color:var(--red)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;border-top:1px solid var(--gray-mid);padding-top:12px}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.bdg-p{background:var(--green-pale);color:var(--green)}.bdg-n{background:var(--red-pale);color:var(--red)}
.pbar-wrap{display:flex;align-items:center;gap:6px}
.pbar{height:6px;border-radius:3px;min-width:4px}
.deriv-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.deriv-card{border:1px solid var(--gray-mid);border-radius:8px;padding:10px;text-align:center}
.deriv-card .dname{font-size:11px;font-weight:600;margin-bottom:4px}
.deriv-card .dqq{font-size:15px;font-weight:600;font-family:var(--mono)}
.deriv-card .dprice{font-size:10px;color:var(--gray2);margin-top:2px}
.ciclo-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.ciclo-card{border:1px solid var(--gray-mid);border-radius:8px;padding:12px;cursor:pointer;transition:.15s;position:relative}
.ciclo-card:hover{border-color:var(--green);background:var(--gray-pale)}
.ciclo-card .cn{font-weight:600;font-size:13px}
.ciclo-card .cm{font-size:11px;color:var(--gray2);margin-top:2px}
.status-pill{display:inline-block;padding:1px 8px;border-radius:8px;font-size:10px;font-weight:600;margin-left:6px}
.st-activo{background:var(--green-pale);color:var(--green)}
.st-cerrado{background:var(--gray-mid);color:var(--gray2)}
.st-cosecha{background:var(--amber-pale);color:var(--amber)}
.info-box{background:var(--teal-pale);border-left:3px solid var(--teal);border-radius:0 6px 6px 0;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--teal)}

.spinner{width:32px;height:32px;border:3px solid var(--gray-mid);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f2f5;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999}
.login-box{background:#fff;border-radius:12px;padding:40px;width:340px;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center}
.login-box .logo{font-size:32px;font-weight:800;color:var(--green);margin-bottom:4px;letter-spacing:-.5px}
.login-box .sub{color:#999;font-size:12px;margin-bottom:24px}
.login-box input{width:100%;padding:9px 12px;border:1px solid var(--gray-mid);border-radius:7px;font-family:var(--font);font-size:13px;margin-bottom:10px;outline:none;text-align:left;display:block;box-sizing:border-box}
.login-box input:focus{border-color:var(--green)}
.btn-login{width:100%;padding:10px;background:var(--green);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;font-family:var(--font)}
.btn-login:hover{background:#175e3a}
.login-err{color:var(--red);font-size:12px;margin-top:8px;display:none}
.user-pill{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.9)}
.user-pill .uname{font-weight:600}
.btn-logout{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:10px;padding:3px 9px;border-radius:4px;cursor:pointer;font-family:var(--font)}
.btn-logout:hover{background:rgba(255,255,255,.3)}

</style>
</head>
<body>
<div id="app">
<div class="topbar">
  <div><div style="font-weight:700;font-size:15px;letter-spacing:.3px">TARS</div><div class="sub">Sistema de Gestion Arrocera</div></div>
  <div class="user-pill" id="user-pill" style="display:none"><span class="uname" id="user-name-tag"></span><button class="btn-logout" onclick="logout()">Salir</button></div>
</div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="topfinca" style="font-size:11px;color:rgba(255,255,255,.75)">Todas las fincas</span>
    <button class="btn" style="background:rgba(255,255,255,.2);color:#fff;font-size:11px;padding:3px 10px" onclick="exportPDF()">⬇ PDF</button>
  </div>
</div>
<div class="nav">
  <button class="active" onclick="T('dashboard')">📊 Dashboard</button>
  <button onclick="T('ciclos')">🔄 Ciclos</button>
  <button onclick="T('fincas')">📍 Fincas</button>
  <button onclick="T('campo')">🌱 Campo</button>
  <button onclick="T('cosecha')">🌾 Cosecha</button>
  <button onclick="T('bascula')">⚖ Bascula</button>
  <button onclick="T('trillo')">⚙ Trillo</button>
  <button onclick="T('ventas')">💰 Ventas</button>
  <button onclick="T('reportes')">📄 Reportes</button>
</div>
<div class="content" id="content"></div>
<div class="modal-overlay" id="moverlay" style="display:none"><div class="modal" id="mbody"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// TARS v4 - Supabase Cloud Edition
const SUPA_URL='https://audjnwaqrleujseorzcd.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1ZGpud2FxcmxldWpzZW9yemNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMzE4NTgsImV4cCI6MjA4OTYwNzg1OH0.Q0VgHX9P5o1JvgKKzkliVYJoUdheSE3aSRWHvbpvYA8';
let CURRENT_USER=null;

// SUPABASE AUTH
async function signIn(email,password){
  const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  });
  const data=await r.json();
  if(!r.ok)throw new Error(data.error_description||data.msg||'Error de autenticacion');
  return data;
}
async function signOut(){
  const token=localStorage.getItem('tars_token');
  if(token){await fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token}}).catch(()=>{});}
  localStorage.removeItem('tars_token');localStorage.removeItem('tars_user');
  CURRENT_USER=null;showLoginScreen();
}
function getToken(){return localStorage.getItem('tars_token')||SUPA_KEY;}

// SUPABASE REST
async function sbFetch(table,method,body,query){
  query=query||'';
  const opts={method:method||'GET',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+getToken(),'Content-Type':'application/json','Accept':'application/json'}};
  if(method==='POST')opts.headers['Prefer']='return=representation';
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SUPA_URL+'/rest/v1/'+table+query,opts);
  if(r.status===204||method==='DELETE')return[];
  const data=await r.json();
  if(!r.ok)throw new Error(JSON.stringify(data));
  return data;
}
const sbGet=(t,q)=>sbFetch(t,'GET',null,q);
const sbPost=(t,d)=>sbFetch(t,'POST',d);
const sbPatch=(t,id,d)=>sbFetch(t,'PATCH',d,'?id=eq.'+id);
const sbDelete=(t,id)=>sbFetch(t,'DELETE',null,'?id=eq.'+id);

// STATE
let S={
  fincas:[],ciclos:[],gastos_campo:[],cosechas:[],basculas:[],trillos:[],ventas:[],
  filtroFinca:'all',filtroCiclo:'all',activeTab:'dashboard',charts:{}
};

const DERIVADOS=['arroz_entero','semolina','puntilla','pallana','fina'];
const DNAMES={arroz_entero:'Arroz entero',semolina:'Semolina',puntilla:'Puntilla',pallana:'Pallana',fina:'Fina'};
const DCOLORS={arroz_entero:'#1F7A4D',semolina:'#52B788',puntilla:'#B5621B',pallana:'#1A4E8A',fina:'#7C3AED'};
const MESES_ES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const CAT_CAMPO=['Insumos','Mano de obra','Maquinaria','Transporte','Combustible','Riego','Arriendo/Alquiler','Mantenimiento','Administracion','Otros'];
const TARIFA_LABELS={descargue:'Descargue',secado:'Secado',mov_patio_bodega:'Mov. patio/sec a bodega',mov_bodega_pila:'Mov. bodega a pila',trillado:'Trillado'};

// LOAD ALL DATA FROM SUPABASE
async function loadAll(){
  showSpinner('Sincronizando datos...');
  try{
    const [fincas,ciclos,gastos,cosechas,basculas,trillos,ventas]=await Promise.all([
      sbGet('fincas','?order=nombre'),
      sbGet('ciclos','?order=inicio.desc'),
      sbGet('gastos_campo','?order=fecha.desc'),
      sbGet('cosechas','?order=fecha.desc'),
      sbGet('basculas','?order=fecha.desc'),
      sbGet('trillos','?order=fecha.desc'),
      sbGet('ventas','?order=fecha.desc'),
    ]);
    S.fincas=fincas||[];S.ciclos=ciclos||[];S.gastos_campo=gastos||[];
    S.cosechas=cosechas||[];S.basculas=basculas||[];
    S.trillos=(trillos||[]).map(t=>{
      if(typeof t.tarifas==='string')try{t.tarifas=JSON.parse(t.tarifas);}catch(e){t.tarifas={};}
      if(typeof t.derivados==='string')try{t.derivados=JSON.parse(t.derivados);}catch(e){t.derivados={};}
      if(!t.tarifas)t.tarifas={};if(!t.derivados)t.derivados={};
      return t;
    });
    S.ventas=ventas||[];
    T(S.activeTab);
  }catch(e){
    document.getElementById('content').innerHTML='<div style="padding:20px;color:var(--red);background:var(--red-pale);border-radius:8px;margin:20px">Error cargando datos: '+e.message+'<br><br><button class="btn btn-g" onclick="loadAll()">Reintentar</button></div>';
  }
}

function showSpinner(msg){
  document.getElementById('content').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:300px;flex-direction:column;gap:12px"><div class="spinner"></div><div style="color:#999;font-size:13px">'+(msg||'Cargando...')+'</div></div>';
}

// AUTH SCREENS
function showLoginScreen(){
  document.getElementById('app').style.display='none';
  let lw=document.getElementById('login-wrap');
  if(!lw){lw=document.createElement('div');lw.id='login-wrap';lw.className='login-wrap';document.body.appendChild(lw);}
  lw.style.display='flex';
  lw.innerHTML='<div class="login-box"><div class="logo">TARS</div><div class="sub">Sistema de Gestion Arrocera</div><input type="email" id="li-email" placeholder="Correo electronico" autocomplete="email"><input type="password" id="li-pass" placeholder="Contrasena" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()"><button class="btn-login" onclick="doLogin()">Entrar</button><div class="login-err" id="li-err"></div></div>';
}

async function doLogin(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  const errEl=document.getElementById('li-err');
  const btn=document.querySelector('.btn-login');
  if(!email||!pass){errEl.textContent='Ingresa correo y contrasena';errEl.style.display='block';return;}
  btn.textContent='Entrando...';btn.disabled=true;errEl.style.display='none';
  try{
    const data=await signIn(email,pass);
    localStorage.setItem('tars_token',data.access_token);
    localStorage.setItem('tars_user',JSON.stringify({email:data.user.email,id:data.user.id}));
    CURRENT_USER={email:data.user.email,id:data.user.id};
    document.getElementById('login-wrap').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('user-pill').style.display='flex';
    document.getElementById('user-name-tag').textContent=CURRENT_USER.email.split('@')[0];
    await loadAll();
  }catch(e){
    errEl.textContent=e.message;errEl.style.display='block';
    btn.textContent='Entrar';btn.disabled=false;
  }
}

function logout(){if(confirm('Cerrar sesion?'))signOut();}

// NAV
function T(tab){
  S.activeTab=tab;
  Object.values(S.charts||{}).forEach(c=>{try{c.destroy();}catch(e){}});
  S.charts={};
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>{if(b.getAttribute('onclick')&&b.getAttribute('onclick').includes("'"+tab+"'"))b.classList.add('active');});
  const fns={dashboard:rDashboard,ciclos:rCiclos,fincas:rFincas,campo:rCampo,cosecha:rCosecha,bascula:rBascula,trillo:rTrillo,ventas:rVentas,reportes:rReportes};
  if(fns[tab])fns[tab]();
}

function mkDoughnut(id,labels,data,colors){const el=document.getElementById(id);if(!el)return;try{S.charts[id]=new Chart(el,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.label+': '+ctx.parsed.toLocaleString();}}}}}})}catch(e){}}
function mkBar(id,labels,datasets){const el=document.getElementById(id);if(!el)return;try{S.charts[id]=new Chart(el,{type:'bar',data:{labels:labels,datasets:datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:10},boxWidth:10}}},scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:9},callback:function(v){return 'C$'+Math.round(v/1000)+'K';}},grid:{color:'rgba(0,0,0,.04)'}}}}}})}catch(e){}}

// INIT
(async function init(){
  const token=localStorage.getItem('tars_token');
  const userStr=localStorage.getItem('tars_user');
  if(token&&userStr){
    try{
      CURRENT_USER=JSON.parse(userStr);
      document.getElementById('user-pill').style.display='flex';
      document.getElementById('user-name-tag').textContent=CURRENT_USER.email.split('@')[0];
      await loadAll();
    }catch(e){
      localStorage.removeItem('tars_token');localStorage.removeItem('tars_user');
      showLoginScreen();
    }
  }else{
    showLoginScreen();
  }
})();

const C$=n=>'C$ '+Math.round(n).toLocaleString('es-NI');
const fmtQQ=n=>parseFloat(n).toFixed(1)+' qq';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const gF=id=>S.fincas.find(f=>f.id===id)||{nombre:'N/A',manzanas:0};
const gC=id=>S.ciclos.find(c=>c.id===id)||{nombre:'N/A'};
const mesLabel=ym=>{const[y,m]=ym.split('-');return MESES_ES[parseInt(m)-1]+' '+y.slice(2)};
function getMeses(){return[...new Set([...S.gastos_campo,...S.ventas].map(m=>m.fecha.slice(0,7)))].sort()}

function calcQQseco(neto,hent,hobj){
  if(!neto||hent<=hobj)return neto;
  return neto*(100-hent)/(100-hobj);
}
function costoTrillo(t){
  const base=t.qq_seco||t.qq_neto_granza||0;
  const total=Object.values(t.tarifas||{}).reduce((s,v)=>s+(v||0),0);
  return base*total;
}
function gastosCampo(fi,ci){return S.gastos_campo.filter(g=>(fi==='all'||g.finca_id===fi)&&(ci==='all'||g.ciclo_id===ci)).reduce((s,g)=>s+g.monto,0)}
function costoTrilloTotal(fi,ci){return S.trillos.filter(t=>(fi==='all'||t.finca_id===fi)&&(ci==='all'||t.ciclo_id===ci)).reduce((s,t)=>s+costoTrillo(t),0)}
function ingresoVentas(fi,ci){return S.ventas.filter(v=>(fi==='all'||v.finca_id===fi)&&(ci==='all'||v.ciclo_id===ci)).reduce((s,v)=>s+v.qq_vendidos*v.precio_qq,0)}
function qqCosechados(fi,ci){return S.cosechas.filter(c=>(fi==='all'||c.finca_id===fi)&&(ci==='all'||c.ciclo_id===ci)).reduce((s,c)=>s+c.qq_cosechados,0)}
function derivadosTotales(fi,ci){
  const tot={arroz_entero:0,semolina:0,puntilla:0,pallana:0,fina:0};
  S.trillos.filter(t=>(fi==='all'||t.finca_id===fi)&&(ci==='all'||t.ciclo_id===ci)).forEach(t=>DERIVADOS.forEach(d=>{tot[d]+=(t.derivados[d]||0)}));
  return tot;
}
function kpis(fi,ci){
  const gc=gastosCampo(fi,ci);const ct=costoTrilloTotal(fi,ci);const gastos=gc+ct;const ing=ingresoVentas(fi,ci);
  return{gc,ct,gastos,ing,utilidad:ing-gastos,margen:ing>0?(ing-gastos)/ing*100:0,qq:qqCosechados(fi,ci)};
}
function costoPorQQ(fi,ci){
  const k=kpis(fi,ci);
  const tFilt=S.trillos.filter(t=>(fi==='all'||t.finca_id===fi)&&(ci==='all'||t.ciclo_id===ci));
  const totSeco=tFilt.reduce((s,t)=>s+(t.qq_seco||0),0);
  const deriv=derivadosTotales(fi,ci);
  const qqAE=deriv.arroz_entero||0;
  const vs=S.ventas.filter(v=>(fi==='all'||v.finca_id===fi)&&(ci==='all'||v.ciclo_id===ci));
  const qqVendido=vs.reduce((s,v)=>s+v.qq_vendidos,0);
  const promVenta=qqVendido>0?vs.reduce((s,v)=>s+v.qq_vendidos*v.precio_qq,0)/qqVendido:0;
  const costoQQseco=totSeco>0?(k.gastos/totSeco):0;
  const costoQQae=qqAE>0?(k.gastos/qqAE):0;
  const margenQQ=promVenta>0&&costoQQseco>0?(promVenta-costoQQseco):0;
  return{costoQQseco,costoQQae,promVenta,margenQQ,totSeco,qqAE};
}

}

// Live calculators
function calcMermaC(){const qq=parseFloat(document.getElementById('m-qq')?.value)||0;const h=parseFloat(document.getElementById('m-hum')?.value)||0;const el=document.getElementById('prev-merma-c');if(!el)return;if(qq>0&&h>12.5){const s=calcQQseco(qq,h,12.5);el.textContent='Estimado seco a 12.5°: '+s.toFixed(1)+' qq  |  Merma: '+(qq-s).toFixed(1)+' qq';el.style.display='block';}else el.style.display='none';}
function calcNeto(){const br=parseFloat(document.getElementById('m-bruto')?.value)||0;const ta=parseFloat(document.getElementById('m-tara')?.value)||0;const el=document.getElementById('prev-neto');if(!el)return;if(br>0&&ta>0){el.textContent='QQ neto granza: '+(br-ta).toFixed(1)+' qq  ('+br+' - '+ta+')';el.style.display='block';calcMermaT();}else el.style.display='none';}
function calcMermaT(){const br=parseFloat(document.getElementById('m-bruto')?.value)||0;const ta=parseFloat(document.getElementById('m-tara')?.value)||0;const neto=br-ta;const he=parseFloat(document.getElementById('m-hent')?.value)||0;const ho=parseFloat(document.getElementById('m-hobj')?.value)||12.5;const el=document.getElementById('prev-merma-t');if(!el)return;if(neto>0&&he>ho){const s=calcQQseco(neto,he,ho);el.textContent='QQ secos: '+s.toFixed(1)+'  |  Merma: '+(neto-s).toFixed(1)+' qq ('+((neto-s)/neto*100).toFixed(1)+'%)';el.style.display='block';calcCostoT();}else el.style.display='none';}
function calcCostoT(){const br=parseFloat(document.getElementById('m-bruto')?.value)||0;const ta=parseFloat(document.getElementById('m-tara')?.value)||0;const neto=br-ta;const he=parseFloat(document.getElementById('m-hent')?.value)||0;const ho=parseFloat(document.getElementById('m-hobj')?.value)||12.5;const seco=neto>0&&he>ho?calcQQseco(neto,he,ho):neto;const total=['descargue','secado','mov_patio_bodega','mov_bodega_pila','trillado'].reduce((s,k)=>s+(parseFloat(document.getElementById('m-t-'+k)?.value)||0),0);const costo=seco*total;const el=document.getElementById('prev-costo-t');if(!el)return;if(seco>0&&total>0){el.textContent='Costo estimado: '+C$(costo)+' ('+seco.toFixed(1)+' qq x C$'+total+'/qq)';el.style.display='block';}else el.style.display='none';}
